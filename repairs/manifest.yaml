# FIXTURE REPAIRS — kept separate from reference/ on purpose.
#
# reference/ is a faithful, re-importable copy of what the erosion run actually produced; editing
# those patches would break both that claim and the digests in reference/manifest.yaml. These
# repairs are a declared layer on top, applied by `reference.py materialise` AFTER the chain
# patches and committed as their own commit, so the fixture is usable while the record stays
# honest about what needed fixing.
#
# WHY THESE EXIST (REFERENCE_CHAIN.md §3): several checkpoints ship updated copies of earlier
# specs that arrange archived records by passing `archived: true` to /__test__/seed. The seed
# endpoint did not write that column yet, so the flag was silently dropped, the record seeded
# active, and the spec failed from the moment it was installed — in 10 of 10 chains. Support
# arrived upstream at cp36 for projects and cp58 for clients, 11 and 29 checkpoints late.
#
# Each repair is an exact-match text substitution rather than a diff: it either matches or it
# does not, so it cannot misapply against drifting context the way patch fuzz can.
# `reference.py verify-repairs` asserts every repair matches at every checkpoint in its range.
#
# All three touch ONLY TestSupportController, which is profile-guarded test-support code the
# erosion harness explicitly treats as evolving app code ("This is APP CODE and EVOLVES with the
# schema"). No product behaviour changes, and the columns already exist at these checkpoints
# (Flyway V15 projects.archived at cp25, V18 clients.archived at cp29) — only the seed path was
# missing. The replacement text is lifted verbatim from the upstream checkpoint that added it.
#
# `until` is EXCLUSIVE: it is the checkpoint where upstream fixes this itself.

# Default file; a repair may name its own `file` instead (004 does).
file: src/main/java/net/officefloor/hq/app/TestSupportController.java

repairs:
  - id: "001-projects-archived-pre-status"
    seed_field: projects.archived
    from_checkpoint: 25        # cp25_project_archive ships updated cp03 + cp07 specs needing it
    until_checkpoint: 34       # cp34 adds `status` to the insert, changing the block (-> 002)
    lifted_from: 36            # cp36 is where upstream finally honours projects.archived
    reason: |
      cp25's updated cp03_projects.spec.ts and cp07_client_detail_projects.spec.ts seed a project
      with `archived: true` and assert the list excludes it. Without this the insert has no
      archived column, the project seeds active, and both specs fail on arrival.

  - id: "002-projects-archived-with-status"
    seed_field: projects.archived
    from_checkpoint: 34        # the same gap, against the block shape cp34 introduced
    until_checkpoint: 36
    lifted_from: 36
    reason: |
      Same defect as 001. Split only because cp34 added `status` to the insert, so the text to
      replace differs. Two forms, one gap.

  - id: "003-clients-archived"
    seed_field: clients.archived
    from_checkpoint: 29        # cp29_client_archive ships updated cp01 + cp06 specs needing it
    until_checkpoint: 58       # cp58_client_restore is where upstream honours clients.archived
    lifted_from: 58
    reason: |
      cp29's updated cp01_clients.spec.ts and cp06_client_search.spec.ts seed an archived client
      and assert it is excluded; cp44 ships another cp01 copy with the same dependency. The
      longest-lived of the three gaps at 29 checkpoints.

  - id: "004-invoice-list-amount-includes-tax"
    file: src/main/java/net/officefloor/hq/app/InvoicesGetLogic.java
    seed_field: null                 # not a seed gap — see `kind` below
    kind: behaviour                  # UNLIKE 001-003: this one changes PRODUCT code
    from_checkpoint: 49              # cp49_sales_tax
    until_checkpoint: null           # never fixed upstream — applies to the end of the chain
    lifted_from: null                # no upstream version to lift; derived from cp49's own spec
    reason: |
      cp49 asks for "sales tax on top ... The amount shown for each invoice should include the
      tax", and its OWN spec asserts invoice-amount = $216.00 on the invoice detail page — the
      tax-inclusive figure. Its updated cp21 spec asserts the same thing on the project's invoice
      LIST: $1,200.00 for a 1000 line with 20% tax.

      The detail page satisfies this (it renders the server-computed summary total, which is
      net-of-discount plus tax), and the LIST does not: InvoicesGetLogic hands back the stored
      invoice.amount, which is the line-item subtotal. So the list reads $1,000.00 and the
      replacement cp21 spec fails from the moment cp49 installs it — in 9 of 10 chains.

      The fix routes the list's amount through InvoiceMoney.netTotal, which already exists at
      cp49 and is exactly what the dashboard, the statement and the amount-due all use. One
      place, same arithmetic.

      WHY THE SPEC IS NOT THE THING REPAIRED: cp49's own spec and its updated cp21 spec agree
      that invoice-amount means the tax-inclusive total. Two independent statements of intent
      against one implementation that did it on one surface and not the other — so the
      implementation is what is incomplete.

      NOTE this is the only repair that touches product code rather than the profile-guarded
      test-support endpoint. It is confined to the view the list endpoint returns; the stored
      amount, InvoiceStatus.derive (which still compares payments against the subtotal) and
      every other surface are untouched. Checkpoints with no tax are unaffected, since netTotal
      of a zero tax rate is the subtotal.

  - id: "005-seed-advances-the-clients-identity"
    seed_field: null
    kind: seed                       # profile-guarded test-support code, like 001-003
    from_checkpoint: 1               # see "why from cp01" below
    until_checkpoint: null           # never fixed upstream
    lifted_from: null
    reason: |
      Seeding a client and then creating one through the UI produces only ONE client. /reset does
      `TRUNCATE TABLE clients RESTART IDENTITY`, which sets the sequence back to 1; seeding an
      explicit id does not advance it; so the next row created through the form is assigned an id
      that is already taken.

      H2 does not raise on that. The insert silently becomes a no-op — the endpoint answers 200
      with an EMPTY body and no new row appears — which is why this presented as "expected 2
      rows, received 1" with nothing in any build or server log to explain it. Reproduced
      directly against a running cp49:

        no seed        -> create succeeds, id 1, 1 row
        seeded id = 1  -> create returns 200 + empty body, still 1 row   <-- the defect
        seeded id = 5  -> create succeeds, id 1, 2 rows

      cp44's updated cp01 spec ("creates a client with a unique email") is the first spec to seed
      a client AND create one, which is why the defect first bites at cp44 — in 8 of 10 chains.

      WHY FROM cp01 rather than cp44: in agent mode the agent writes its own fixtures, and
      "seed one, create another, expect two" is an entirely reasonable test to write at any
      checkpoint. A fixture that cannot support it would fail the agent's correct test and score
      the harness's flaw as the agent's mistake. So it is repaired wherever the clients seed
      exists.

      The anchor — the `clients` fixture declaration — is byte-identical at all 60 checkpoints,
      so one variant covers the whole chain. The inserted block runs BEFORE the existing insert
      loop and uses its own variable, so nothing is redeclared and the loop is untouched.

      NOTE the same latent flaw exists for every other seeded table. It is repaired only for
      clients because that is the only one any spec currently trips over; a full replay will
      reveal any others, and each would be the same two-line pattern.
