# test-fidelity-long-run configuration. The driver and grader that consume this are not built yet
# (DESIGN.md §11); the values here record decisions already made, so they are not re-litigated.

# CHAINS: how many independent runs of the whole 60-checkpoint sequence (DESIGN.md §5).
#
# Two by default, because ONE agent run can be lucky: the agent is stochastic, so a single
# sequence cannot tell "this agent writes sound tests" from "this attempt happened to".
#
# REPLAY mode collapses this to 1 and says so. Replay is deterministic — the same specs against
# the same application — so a second chain re-measures nothing but environmental flakiness, and
# `grading.green.repeats` already measures that per checkpoint, far more cheaply. Pass --chains
# explicitly to override.
chains: 2

# MODE (DESIGN.md §4.3). `replay` installs the erosion harness's own authored suite instead of
# running an agent, commits nothing, and validates the harness, the fixture and the mutation
# catalogue all at once. It is the first thing to run and the only way to tell a harness bug from
# a fixture defect from a bad test. `agent` is the real measurement.
mode: replay

model: claude-opus-4-8
agent_timeout: 3600

# What the test-writing agent may READ of the application (DESIGN.md §4.2).
#   previous  the app at cp(N-1) — the pipeline's own information state, and the default. The new
#             behaviour is absent, so there is nothing to copy; the agent can confirm its priors
#             still pass and its new test correctly fails, but CANNOT iterate the new test to
#             green. That asymmetry is the thing being measured — do not remove it.
#   none      contract and prior tests only. Strictly harder, but it conflates "could not
#             navigate" with "misread the request".
#   current   DIAGNOSTIC ONLY — a ceiling. If fidelity is poor even with the implementation
#             visible, the problem is not information.
code_view: previous

# CONDITION (DESIGN.md §4.4) — which research arm this run is. The grader is identical across all
# of them; only what the author is given, or what becomes of its draft, moves. Recorded in the run
# manifest and in the suite branch name, so a run's arm is legible without reading its config:
#
#   blind                  the default. Request and contract only, one shot (§4.1).
#   prototype-first        the author also sees the validated cpN. This IS code_view=current.
#   clarify-oracle         a prompter-proxy the author may ask behavioural questions (§4.5).
#   blind-ai-review        a second turn critiques the draft for gaps; no ground truth.
#   write-twice            two independent blind authors, reconciled. Conditional on variance.
#   prompter-proxy-review  a reviewer returns English behavioural feedback on the draft.
#
# Only `blind` and `prototype-first` are implemented — the latter being code_view, which already
# existed. The other four are declared here so a run can be LABELLED and named correctly, and the
# harness refuses one it cannot actually carry out rather than producing a mislabelled branch.
condition: blind

# BASE SUITE (DESIGN.md §4.6) — what the round's priors are, which is what decides WHICH QUESTION
# the run answers. Orthogonal to `condition`: any arm can be run under either base.
#
#   accumulated  the agent's own suite from cp01..N-1, warts carried forward. THE DEFAULT, and the
#                only setting that can answer §1 — whether small inaccuracies and missing coverage
#                COMPOUND. Mutation scope is every in-force set cp01..N (see `retention`).
#   reference    tools/suite.py installs the known-good suite at cp(N-1) instead. Priors are
#                calibrated, so nothing the round fails to hold was inherited: this measures
#                INDIVIDUAL test correctness, and its mutation scope is cpN's set plus the sets of
#                the checkpoints cpN revises. It also makes the checkpoints near-independent, so
#                analysis may resample checkpoints rather than chains (§8.1).
#
# The two are a PAIR, not a choice: cumulative - individual at matched checkpoints is the cost of
# the agent's own history, which is the only thing that separates "worse as the suite grows" from
# "tripping over its own earlier mistakes".
base_suite: accumulated

# THE REPAIR TURN (DESIGN.md §4.7). The author cannot see cpN, so a test that is right about the
# REQUEST may still not run green against the implementation that was built. In the pipeline that
# is not a failure — writing the code to the tests also adjusts the tests, and no pull request is
# merged with a red suite. Without this step one bad prior at cp07 leaves fifty later checkpoints
# non-green for a reason that is not about them, which is the instrument breaking, not compounding.
#
# TWO COMMITS per checkpoint, graded at both. `cpNN author` holds exactly what was written blind
# and takes the full mutation scope — it IS the fidelity score. `cpNN repair` holds the same suite
# with its failures fixed against cpN's working code, and is what carries forward.
#
# The author commit is what protects the measurement, NOT a restriction on repair: it is committed
# and graded before the implementation is ever shown, so nothing repair does can improve it. Repair
# is therefore allowed to be realistic, and `kill_rate_author - kill_rate_repair` becomes its own
# metric — coverage destroyed by relaxing an assertion until it passed.
repair:
  enabled: true
  # NO NEW TESTS, and this is about strategy rather than score: a test written with cpN visible is
  # `prototype-first`, and one added here would quietly turn a blind run into a hybrid, which is
  # the one thing §4.4 asks the arms not to be. Enforced structurally, per §4.5 — the title set at
  # `repair` must be a subset of the set at `author`; an attempt is reverted and kept as a DIFF,
  # using the same snapshot-and-restore that already enforces a critique-only brief.
  scope: fix_only
  # A deletion is not a repair either. `revised` vs `dropped` is already classified, and `repair`
  # may not hold fewer tests than `author`.
  forbid_deletions: true
  attempts: 2                 # bounded, like `limits`. Still red after this records
                              #   `repair_failed` and carries forward: halting the chain would
                              #   spend the remaining checkpoints to learn nothing.
  commit: separate            # `cpNN author`, then `cpNN repair`. Two suite shas per checkpoint,
                              #   which is also what splits §8 churn into chosen vs forced.

# RETENTION (DESIGN.md §6.1) — re-running EARLIER checkpoints' mutation sets against the suite as
# it stands now, which is the only direct read on whether coverage won at cp12 is still held at
# cp40. Meaningful under `base_suite: accumulated` only; a reference base has no inherited damage.
#
# Supersession comes from the fixture, not from judgement: checkpoint K's set is in force at N
# unless some J in (K, N] declares K in its `mutates`, in which case J's set carries that
# behaviour instead. A mutation whose `find` text no longer exists is NON-APPLYING and excluded —
# the substitution format raises rather than silently no-opping, so staleness reports itself.
# Both exclusion lists are printed by name beside the kill rate: `mutates` is a declaration and
# this fixture has already been caught under-declaring one (tools/reference_chain.py), so a silent
# filter could let that suppress a real coverage loss.
retention:
  # Milestones, not every checkpoint: at ~2.2N in-force mutations per round, every checkpoint is
  # ~4,000 suite runs against today's 133 (~30x, not viable) where six milestones are ~470 (~3.5x).
  # The question is a CURVE, and six complete sets read it better than sixty sampled ones.
  at: [10, 20, 30, 40, 50, 60]
  sample_per_round: 0         # off. A sampled kill rate over a small set mostly reports its own
                              #   sampling, and the milestones already carry the curve.

# The 60 plain-English change requests, with their `type` and `mutates`. Read from the erosion
# harness rather than copied, so a repair to the checkpoint metadata lands in one place — and it
# needs repairing (DESIGN.md §10, REFERENCE_CHAIN.md).
erosion_harness: ~/ui-long-degradation-test
checkpoints_file: ${erosion_harness}/checkpoints.yaml

# THE FIXED APPLICATION (DESIGN.md §2). Imported ONCE into reference/ by
#   tools/reference.py import --repo <stack> --branch <chain>
# and owned by this repo thereafter. The stack repos are records of completed runs: this harness
# never writes to them, and does not read them at run time either — a later erosion run would
# otherwise change what every score here meant. reference/manifest.yaml holds the provenance.
reference:
  dir: reference
  # Provenance, recorded into every checkpoint's capture. By NAME and ORIGIN, not by local path:
  # a path says nothing to anyone else and nothing to this machine a year from now, whereas the
  # origin is how the chain this fixture came from is found again. reference/manifest.yaml holds
  # the same pair plus the per-checkpoint commits.
  repo: officehq-tanstack-officefloor
  origin: git@github.com:officefloor/officehq-tanstack-officefloor.git
  branch: evolve/202610020135/just-solve/chain2
  # Checkpoints whose patch is empty: the chain already satisfied the request. GRADED like any
  # other — they test whether the agent recognises a request its suite already covers, or writes
  # tests for it that pass with no code change. Only mutation zero inverts: N-1 is the same
  # application, so this round's tests must PASS against it (DESIGN.md §2, §5).
  no_code_change: [40, 50]
  # The stack's own contract for building, serving and stopping the app (docs/SUT_CONTRACT.md in
  # the erosion harness). The driver never looks inside these.
  app:
    build_cmd: bin/build
    start_cmd: bin/start
    stop_cmd: bin/stop
    port: 0                   # 0 = pick a free port per run. NOT pinned: a 60-checkpoint run
                              #   serves the app 100+ times, and a JVM left by a killed run
                              #   would hold the port and let the next checkpoint gate against
                              #   a stale app that still reports healthy.
    health_url: null          # derived from the chosen port

build:
  timeout: 1800               # bin/build (Maven: front-end -> static/, then the jar)
  start_timeout: 300
  ready_timeout: 180

# The interface contract handed to the agent with each request (DESIGN.md §3), so its anchors
# match the implementation. Built by tools/contract.py, calibrated by `contract.py check`.
contracts:
  dir: contracts
  # seed_accepts is not optional: a seed field the endpoint does not honour is accepted and
  # silently dropped, and the spec then fails nowhere near the mistake. That is the cp25 defect
  # (DESIGN.md §3), and an agent told only the testids walks straight into it.
  include_in_prompt: [new_testids, new_audit_records, available_testids, available_audit_records,
                      seed_accepts]

# Where the suite under test lives in the confined area. In `agent` mode this is the agent's own
# accumulated suite and its git history is what DESIGN.md §8 measures, so it is committed per
# checkpoint. In `replay` mode tools/suite.py installs the erosion harness's authored suite here
# and NOTHING is committed.
generated_suite:
  dest_subpath: e2e/specs
  support_subpath: e2e/support     # seed + audit helpers: READ-ONLY to the agent — the two
                                   #   assertion channels the contract declares
  run_cmd: bin/e2e

grading:
  green:
    repeats: 2                     # identical runs; a test that flips is flaky (DESIGN.md §5)
    suite_size: non_decreasing     # at least as many tests as the previous checkpoint. Equal is
                                   #   allowed — a mutative checkpoint may rewrite rather than
                                   #   add, and a no-code checkpoint may already be covered. A
                                   #   SMALLER suite is a test deleted to go green.
  mutation:
    catalogue: mutations/
    require_calibrated: true       # refuse an uncalibrated set rather than report a soft number
    one_at_a_time: true            # apply ONE mutation, run, require a new failure, REVERT.
                                   #   Batched mutations are indistinguishable: one failing test
                                   #   would mark the whole batch killed, so a suite pinning one
                                   #   clause scores the same as one pinning them all.
    zero: previous_checkpoint      # mutation zero is free: the app at N-1 is the feature removed
    zero_inverted_on_no_code: true #   ... except where N-1 is the same app: then it must SURVIVE
  maintenance:
    track_deletions: true          # a deleted prior is the cheap way out; counted separately

# Agent-mode retry policy, mirroring the erosion harness: a usage limit is waited out, a
# transient failure is backed off. Every attempt is recorded, so a checkpoint's true wall clock
# and cost — retries and quota waits included — stay recoverable.
limits:
  max_attempts: 500
  max_transient_attempts: 20
  retry_backoff_max: 900
  poll_seconds: 1800          # how long to wait out a usage limit before retrying

isolation:
  agent_confinement:
    enabled: true             # Landlock. Agent mode REFUSES to run without it (unlike the
                              #   erosion harness, which had a mirror-based fallback): here
                              #   withholding the answers IS the confinement, so unconfined
                              #   measures nothing. FIDELITY_NO_CONFINE=1 overrides deliberately.
    extra_ro_binds: []
    extra_rw_binds: []

# BLINDNESS (DESIGN.md §7). Reuses the erosion harness's Landlock confinement, which fails closed
# if any listed path is reachable from the agent turn. The inversion vs that harness: application
# source is READABLE here — it is the input. What is withheld is every statement of what the
# application should do.
# The confined area holds the suite so far, the e2e scaffolding (read-only), the checkpoint
# specification, and the application at cp(N-1). Everything below must be unreachable, and
# verify_denied refuses to start the turn if any of it is not.
blind:
  # Refuse a turn when the sandbox contains a HARD leak — anything naming a specific checkpoint
  # or the harness. ON, because the rigorous behaviour belongs in the default and a parameter
  # should be what trades it away.
  #
  # It was briefly off, for a bad reason: the stack's own base scaffolding carries a handful of
  # such comments that predate this harness, so strict mode refused every run. The fix is not a
  # loose default — it is to ACKNOWLEDGE those specific hits and keep refusing new ones. Each
  # entry below is matched on file + substring rather than line number, so it survives the line
  # moving; anything NOT listed still stops the turn.
  strict: true
  known_leaks:
    - file: pom.xml
      contains: "Found via the cp01 dry run"
    - file: src/main/java/net/officefloor/hq/app/Audit.java
      contains: "Checkpoints assert the exact line(s)"
    - file: src/main/java/net/officefloor/hq/app/Application.java
      contains: "checkpoints add migrations"
    - file: src/main/frontend/vite.config.ts
      contains: "must never appear in a checkpoint's diff"
  deny:
    - ${erosion_harness}/acceptance/specs    # the experimenter's reference suite — the answer
    - ${erosion_harness}/checkpoints.yaml    # future requests + sequence hints
    - mutations/                             # the depth oracle's patches
    - reference/                             # EVERY future checkpoint's code. The area is built
                                             #   by materialising cp(N-1) elsewhere and copying
                                             #   it in; the patch chain never enters it.

# §4.4 CONDITION PARAMETERS. Only the arms that take one appear here; an arm's parameters are
# recorded in the run manifest with everything else, so a run's arm and its settings travel
# together.
conditions:
  clarify_oracle:
    # How many behavioural questions the prompter-proxy will answer (§4.5). An unbounded oracle
    # approaches full disclosure and stops modelling any real interaction, so the budget is part
    # of the condition rather than a convenience — and the number actually spent is measured,
    # since an author that asks nothing is itself a result.
    question_budget: 5
