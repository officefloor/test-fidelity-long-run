# Mutation set for cp55_dashboard_top_clients.
#
# "On the home screen show me my top five clients. Rank them by how much they owe."
#
# The reference fixture seeded only three owing clients, so removing the limit of five was
# invisible — a cap of five cannot be observed with three candidates. That hole is now CLOSED:
# cp55 seeds six owing clients and asserts the list caps at five (erosion harness 3a8b947), and
# 002 below is the mutation it unlocked.
checkpoint: 55
calibrated: true

mutations:
  - id: "001-top-clients-are-ranked-smallest-first"
    clause: "Rank them by how much they owe"
    file: src/main/java/net/officefloor/hq/app/DashboardTopClientsGetLogic.java
    breaks: |
      The ranking is ascending, so the client who owes LEAST heads the list. The panel is
      populated, ordered and complete — only an assertion on who is first catches the direction.
    find: "                .sorted(Comparator.comparing(TopClientView::getOutstanding).reversed()"
    replace: "                .sorted(Comparator.comparing(TopClientView::getOutstanding)"

  - id: "002-top-clients-is-not-capped-at-five"
    clause: "my top five clients"
    file: src/main/java/net/officefloor/hq/app/DashboardTopClientsGetLogic.java
    breaks: |
      The list is not capped, so every owing client appears. Unlocked by cp55 now seeding six
      owing clients — with three, a cap of five is unobservable.
    find: "                .limit(TOP_N)"
    replace: "                .limit(Long.MAX_VALUE)"
