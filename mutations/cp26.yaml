# Mutation set for cp26_project_tags.
#
# "Let me put labels on projects so I can group them."
#
# cp26's spec did not read the audit channel at all, so dropping the PROJECT_TAGGED /
# PROJECT_UNTAGGED records would have survived it — the records existed and were asserted
# nowhere. That hole is now CLOSED (erosion harness 3a8b947); 003 and 004 below are the
# mutations it unlocked, and both are reachable only through the audit file.
checkpoint: 26
calibrated: false

mutations:
  - id: "001-tag-shows-its-id-instead-of-its-name"
    clause: "put labels on projects"
    file: src/main/frontend/features/projects/ProjectTags.tsx
    breaks: |
      A label renders as a number. The tag is assigned, the chip is there, and it is
      unreadable — survived by any test that only checks a chip appeared.
    find: "            <span data-testid={`project-tag-${tag.id}`}>{tag.name}</span>"
    replace: "            <span data-testid={`project-tag-${tag.id}`}>{tag.id}</span>"

  - id: "002-every-tag-looks-assigned"
    clause: "so I can group them"
    file: src/main/frontend/features/projects/ProjectTags.tsx
    breaks: |
      The project shows every tag in the system as though it carried all of them, so
      grouping means nothing. Killed by asserting that an UNassigned tag is absent — the negative
      case a suite most often skips.
    find: "        {assigned.map((tag) => ("
    replace: "        {allTags.map((tag) => ("

  - id: "003-tagging-is-not-recorded"
    clause: "put labels on projects"
    file: src/main/java/net/officefloor/hq/app/ProjectTagsAddLogic.java
    breaks: |
      The label is applied and nothing is written to the audit file. Invisible through the UI —
      unlocked by cp26 now reading the audit channel at all.
    find: "            audit.record(\"PROJECT_TAGGED project=\" + projectId + \" tag=\" + tagId);"
    replace: "            // mutation: no audit record is written"

  - id: "004-untagging-is-not-recorded"
    clause: "so I can group them"
    file: src/main/java/net/officefloor/hq/app/ProjectTagsRemoveLogic.java
    breaks: |
      The label is removed and the removal is not recorded. The other half of the same channel.
    find: "            audit.record(\"PROJECT_UNTAGGED project=\" + projectId + \" tag=\" + tagId);"
    replace: "            // mutation: no audit record is written"
