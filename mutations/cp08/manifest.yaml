# Mutation set for cp08_dashboard — FORMAT EXAMPLE; the patches are not yet authored.
#
# The request (checkpoints.yaml cp08):
#   "I want a home screen. Show me how many clients and projects I have. Show me how much money
#    I am still owed."
#
# Three clauses -> three independent claims a generated suite might or might not hold. Each
# mutation breaks exactly one, so kill rate reads as the share of the request actually pinned
# rather than a single pass/fail.
#
# Anchors available to a test here are contracts/cp08.yaml. cp08 introduces exactly:
#   dashboard, dashboard-clients-count, dashboard-error, dashboard-loading,
#   dashboard-outstanding-total, dashboard-page, dashboard-projects-count, nav-dashboard
# (52 anchors are available in total by this point — see that file).
checkpoint: 8
calibrated: false          # set once the reference spec for cp08 kills every mutation below

mutations:
  - id: "001-client-count-off-by-one"
    clause: "how many clients I have"
    patch: 001-client-count-off-by-one.patch
    breaks: |
      The client tally reports one fewer than exists. Killed by any test asserting an exact
      count; survived by one that only asserts the tile is present or non-zero.

  - id: "002-outstanding-includes-paid"
    clause: "how much money I am still owed"
    patch: 002-outstanding-includes-paid.patch
    breaks: |
      Paid invoices are counted in the outstanding total. The behavioural heart of the clause and
      the one a test written by reading the code is most likely to miss: correct and mutated both
      show a plausible figure, so only a test that seeds a paid invoice and asserts the exact
      total catches it.

  - id: "003-project-count-counts-archived"
    clause: "how many projects I have"
    patch: 003-project-count-counts-archived.patch
    breaks: |
      Archived projects are counted. Only observable once archiving exists (cp25), so this
      mutation belongs to cp25's set and later, not cp08's — a later checkpoint's manifest
      restates it rather than this one growing. Listed here to record the reasoning.
    applies_from: 25
