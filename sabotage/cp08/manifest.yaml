# Sabotage set for cp08_dashboard — FORMAT EXAMPLE, patches not yet authored.
#
# The request (checkpoints.yaml cp08):
#   "I want a home screen. Show me how many clients and projects I have. Show me how much money
#    I am still owed."
#
# Three clauses -> three independent claims a generated test suite might or might not hold. Each
# sabotage breaks exactly one of them, so the kill rate reads as a share of the request actually
# pinned rather than a single pass/fail.
checkpoint: 8
reference:
  repo: ~/officehq-tanstack-officefloor
  branch: evolve/202610020135/just-solve/chain2
  commit: null            # filled by the harness: the `cp08 reset` commit on that branch
calibrated: false         # set by `--calibrate` once the reference suite kills all of these

sabotages:
  - id: "001-client-count-off-by-one"
    clause: "how many clients I have"
    patch: 001-client-count-off-by-one.patch
    breaks: |
      The client tally counts one fewer than exists. Kills any test asserting an exact count;
      survives a test that only asserts the tile is present or non-zero.

  - id: "002-outstanding-includes-paid"
    clause: "how much money I am still owed"
    patch: 002-outstanding-includes-paid.patch
    breaks: |
      Paid invoices are included in the outstanding total. The behavioural heart of the clause,
      and the one a test written by reading the code is most likely to miss: both the correct and
      the sabotaged version show a plausible figure.

  - id: "003-project-count-counts-archived"
    clause: "how many projects I have"
    patch: 003-project-count-counts-archived.patch
    breaks: |
      Archived projects are counted. Only observable once archiving exists (cp25), so this
      sabotage is authored against cp08 but asserted from cp25 onward — the manifest for a later
      checkpoint re-states it rather than this one growing.
